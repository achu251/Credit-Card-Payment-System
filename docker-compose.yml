services:
  django:
    build:
      context: ./Backend/django_backend
    container_name: credit-card-django
    env_file:
      - ./Backend/django_backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3307"
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

  fastapi:
    build:
      context: ./fastapi_backend
    container_name: credit-card-fastapi
    env_file:
      - ./fastapi_backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3307"
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./Frontend
    container_name: credit-card-frontend
    ports:
      - "5173:80"
    depends_on:
      - django
      - fastapi
